# Сборка Android-клиента Selfvoy (APK) — артефакт Actions.
#
# Результат: вкладка Actions → «Build Android APK» → Artifacts →
# selfvoy-android-debug (app-debug.apk). Это debug-сборка: ставится на
# устройство напрямую, подписана debug-ключом. Для релиза в Google Play
# нужен release + ваш keystore (см. docs/ANDROID.md).
#
# Без app/google-services.json (его нет в репозитории) APK собирается
# без FCM — приложение честно показывает «Push не настроен».
#
# Безопасность: сборка (Gradle исполняет код из репозитория) идёт с токеном
# только на чтение; публикация — отдельными job'ами с правом записи, которые
# лишь скачивают артефакты. Ветка builds/android и релиз «builds» обновляются
# только push'ем в main; лог — в arena/build-logs на любом push.
name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Gradle — app-debug.apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # compileSdk/targetSdk проекта (android/app/build.gradle.kts).
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Gradle wrapper
        working-directory: android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gradle
          gradle wrapper --gradle-version 8.7

      - name: Сборка APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      - name: Артефакт — APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selfvoy-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Артефакт — лог сборки (для отладки)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-android
          path: build.log

      # Ошибки компиляции — в аннотации прогона (читаются через API).
      - name: Диагностика (аннотации)
        if: always()
        run: |
          set +e
          LOG=""
          for f in android/app/build.log android/build.log build.log; do
            [ -f "$f" ] && LOG="$f" && break
          done
          if [ -n "$LOG" ]; then
            grep -E "^e: |error:|FAILURE" "$LOG" | tail -20 | while IFS= read -r line; do
              printf '::error title=android-build::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
            done
            # Секция "What went wrong" — там текст настоящей ошибки.
            printf '::error title=android-cause::%s\n' "$(awk '/What went wrong/{f=1} f{print} f&&/BUILD FAILED/{exit}' "$LOG" | head -25 | tr '\r' ' ' | tr '\n' '~' | cut -c1-1500)"
            # Первые 30 строк лога (задача и конфигурация).
            printf '::error title=android-head::%s\n' "$(head -30 "$LOG" | tr '\r' ' ' | tr '\n' '~' | cut -c1-1500)"
          fi
          exit 0

  # Готовый APK — в ветку builds/android (песочница разработки не видит
  # blob-хосты артефактов) и в релиз «builds». Только push в main.
  publish:
    name: Публикация APK (main)
    needs: apk
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: selfvoy-android-debug
          path: apk

      - name: Публикация в ветку builds/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir pub && cp apk/app-debug.apk pub/Selfvoy-debug.apk
          cd pub
          for f in *; do
            if [ "$(wc -c < "$f")" -gt 94000000 ]; then split -b 90m -d "$f" "$f.part"; rm "$f"; fi
          done
          git init -q -b builds/android
          git config user.name selfvoy-ci && git config user.email ci@selfvoy.local
          git add -A && git commit -qm "android ${{ github.sha }} [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/builds/android

      # Страница Releases → «Сборки Selfvoy»: файлы можно скачать прямо оттуда.
      - name: Публикация в релиз «builds» (Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          gh release view builds -R "$R" >/dev/null 2>&1 || gh release create builds -R "$R" \
            --prerelease --target "$GITHUB_SHA" --title "Сборки Selfvoy (последние)" \
            --notes "Автоматические сборки из main. Selfvoy-debug.apk и Selfvoy-Setup.exe — нативные клиенты (Compose, Qt). Selfvoy-web.apk и Selfvoy-web-Setup.exe — веб-клиент (Capacitor, Electron). Всем нужен сервер Selfvoy." || true
          mkdir -p pubrel && cp apk/app-debug.apk pubrel/Selfvoy-debug.apk
          gh release upload builds pubrel/Selfvoy-debug.apk -R "$R" --clobber
          # Файл со старым именем (до переименования продукта в Selfvoy).
          gh release delete-asset builds Aura-debug.apk -R "$R" -y || true

  # Песочница разработки не видит blob-хосты артефактов — дублируем лог
  # в ветку arena/build-logs, откуда его можно прочитать обычным git.
  log:
    name: Лог сборки → arena/build-logs
    needs: apk
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-log-android

      - name: Публикация лога
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Шаг вспомогательный: git-ошибки не должны ронять job.
          set +e
          rm -f push-diag.log
          echo "run ${{ github.run_id }} job android" > push-diag.log
          for i in 1 2 3; do
            rm -rf logpub
            {
              git -c http.extraHeader="Authorization: token $GH_TOKEN" \
                clone --depth 1 --branch arena/build-logs \
                "https://github.com/${{ github.repository }}" logpub 2>&1
              echo "clone exit=$?"
            } >> push-diag.log
            if [ ! -d logpub/.git ]; then
              # клон не удался — создаём репозиторий локально
              mkdir -p logpub
              (
                cd logpub
                git init -q
                git remote add origin "https://github.com/${{ github.repository }}"
                git -c http.extraHeader="Authorization: token $GH_TOKEN" fetch --depth 1 origin arena/build-logs
                git checkout -q -B arena/build-logs FETCH_HEAD
              ) >> push-diag.log 2>&1
            fi
            [ -f build.log ] && cp build.log logpub/android-build.log
            (
              cd logpub
              git config user.name "selfvoy-ci"
              git config user.email "ci@selfvoy.local"
              git add -A 2>&1
              git commit -m "android log ${{ github.sha }} [skip ci]" 2>&1
              git -c http.extraHeader="Authorization: token $GH_TOKEN" push origin HEAD:arena/build-logs 2>&1
            ) >> push-diag.log 2>&1 && echo "push ok" >> push-diag.log && break
            sleep 10
          done
          printf '::error title=android-publish::%s\n' "$(tail -14 push-diag.log | tr '\r' ' ' | tr '\n' '~' | cut -c1-1500)"
          exit 0
