# project.yml — спецификация XcodeGen для iOS-приложения Aura.
#
# Генерация проекта:  brew install xcodegen && cd ios && xcodegen generate
# После этого:        open Aura.xcodeproj   (схема Aura, iOS 17+)
name: Aura
options:
  bundleIdPrefix: ai.aura
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ru

packages:
  AuraKit:
    path: AuraKit

targets:
  Aura:
    type: application
    platform: iOS
    sources:
      - Aura
    dependencies:
      - package: AuraKit
    info:
      path: Aura/Info.plist
      properties:
        CFBundleDisplayName: Aura
        CFBundleURLTypes:
          - CFBundleURLName: ai.aura.app
            CFBundleURLSchemes:
              - aura
        NSMicrophoneUsageDescription: >-
          Микрофон нужен для голосовых запросов Ауре.
        NSSpeechRecognitionUsageDescription: >-
          Распознавание речи используется, чтобы превращать голос в текст
          прямо на устройстве.
        NSRemindersFullAccessUsageDescription: >-
          Доступ к напоминаниям нужен, чтобы переносить задачи Aura
          в системные напоминания iOS (только по вашей кнопке).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Этап 13: тихое пробуждение при push-доставке (APNs).
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Aura/Aura.entitlements
      properties:
        # Push Notifications: development для отладки; при архивации
        # Xcode подставит production автоматически (aps-environment).
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aura.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  AuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AuraTests
    dependencies:
      - target: Aura
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aura.app.tests
        GENERATE_INFOPLIST_FILE: YES
