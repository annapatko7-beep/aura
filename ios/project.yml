# project.yml — спецификация XcodeGen для iOS-приложения Selfvoy.
#
# Генерация проекта:  brew install xcodegen && cd ios && xcodegen generate
# После этого:        open Selfvoy.xcodeproj   (схема Selfvoy, iOS 17+)
name: Selfvoy
options:
  bundleIdPrefix: app.selfvoy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ru

packages:
  SelfvoyKit:
    path: SelfvoyKit

targets:
  Selfvoy:
    type: application
    platform: iOS
    sources:
      - Selfvoy
    dependencies:
      - package: SelfvoyKit
    info:
      path: Selfvoy/Info.plist
      properties:
        CFBundleDisplayName: Selfvoy
        CFBundleURLTypes:
          - CFBundleURLName: app.selfvoy
            CFBundleURLSchemes:
              - selfvoy
        NSMicrophoneUsageDescription: >-
          Микрофон нужен для голосовых запросов к Selfvoy.
        NSSpeechRecognitionUsageDescription: >-
          Распознавание речи используется, чтобы превращать голос в текст
          прямо на устройстве.
        NSRemindersFullAccessUsageDescription: >-
          Доступ к напоминаниям нужен, чтобы переносить задачи Selfvoy
          в системные напоминания iOS (только по вашей кнопке).
        ITSAppUsesNonExemptEncryption: false
        # Тема — системная: все экраны (дизайн 2026, системный шрифт) бывают
        # светлыми и тёмными вслед за настройкой iOS.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Этап 13: тихое пробуждение при push-доставке (APNs).
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Selfvoy/Selfvoy.entitlements
      properties:
        # Push Notifications: development для отладки; при архивации
        # Xcode подставит production автоматически (aps-environment).
        aps-environment: development
    scheme:
      testTargets:
        - SelfvoyTests
        - SelfvoyUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.selfvoy
        # Иконка из Selfvoy/Resources/Assets.xcassets (единый 1024×1024).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  SelfvoyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SelfvoyTests
    dependencies:
      - target: Selfvoy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.selfvoy.tests
        GENERATE_INFOPLIST_FILE: YES

  # Проход по экранам со скриншотами (без dev-стека пропускается).
  SelfvoyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SelfvoyUITests
    dependencies:
      - target: Selfvoy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.selfvoy.uitests
        GENERATE_INFOPLIST_FILE: YES
