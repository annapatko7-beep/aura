# Базовые настройки Gradle для Android-клиента Aura.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Компоненты Jetpack — только AndroidX (обязательно для Compose и Firebase).
android.useAndroidX=true

# Kotlin: официальный стиль кода.
kotlin.code.style=official

# Не собирать лишние варианты.
android.nonTransitiveRClass=true
