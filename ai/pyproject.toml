[project]
name = "aura-ai"
version = "0.1.0"
description = "Python AI Service для сети ИИ-агентов Aura"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sqlglot>=25.0"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aura_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
